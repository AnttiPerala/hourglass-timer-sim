<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hourglass Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --bg:#0b0d10; --ink:#eaeaef; --sub:#98a6be; --line:#2a3444; --accent:#1d6fff; }
    html, body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial, sans-serif;}
    header { padding:10px 12px; display:flex; gap:10px; align-items:center; background:#0f141b; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
    header .title { font-weight:700; }
    header .sub { color:var(--sub); font-size:12px; }
    main { padding:10px 12px; display:grid; grid-template-columns: 1fr; gap:10px; }
    #wrap { display:flex; justify-content:center; }
    canvas { background:#06080b; border:1px solid #1d2330; border-radius:10px; width: min(1200px, 96vw); height: calc(min(1200px,96vw)*1.2); max-height: 88vh; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .chip { background:#121a25; border:1px solid #223042; padding:4px 8px; border-radius:8px; font-size:12px; }
    input[type=range]{ width:280px; }
    button { background:var(--accent); color:white; border:none; border-radius:8px; padding:6px 10px; font-weight:600; cursor:pointer; }
    button#pause { background:#273142; }
    input, select { background:#0f151e; color:var(--ink); border:1px solid #273446; border-radius:6px; padding:4px 6px; }
    #warn { color:#ffb870; }
    .muted { color:var(--sub); }
    label { font-size:13px; color:var(--sub); }
  </style>
</head>
<body>
  <header>
    <div class="title">Hourglass Player</div>
    <div class="row">
      <span>Open JSON:</span><input id="file" type="file" accept=".json">
    </div>
    <div id="metaNote" class="sub"></div>
  </header>

  <main>
    <div id="wrap"><canvas id="cv" width="1000" height="1200"></canvas></div>

    <div class="row">
      <button id="play">Play</button>
      <button id="pause">Pause</button>
      <div>Frame:</div>
      <input id="slider" type="range" min="0" max="0" value="0">
      <span class="chip" id="finfo">0/0</span>
      <span class="chip">fps: <span id="fps">60</span></span>
      <button id="jump">Jump to lastCrossFrame</button>
    </div>

    <div class="row">
      <span>Align last-cross to (s):</span>
      <input id="alignSec" type="number" placeholder="e.g. 60" step="1" min="1" style="width:90px" title="Scale playback so lastCross occurs at this second mark">
      <button id="resetAlign" class="chip" title="Restore original fps">Reset alignment</button>
      <span id="alignInfo" class="muted"></span>
    </div>

    <div class="row">
      <span>Zoom:</span>
      <input id="zoom" type="range" min="10" max="200" step="5" value="100" title="Zoom the view (10–200%)">
      <span id="zoomLbl" class="chip">100%</span>
      <span style="width:12px"></span>
      <span>Pan&nbsp;Y:</span>
      <input id="panY" type="range" min="-100" max="100" step="1" value="0" title="Vertical pan in % of H (negative moves up, positive down)">
      <span id="panYLbl" class="chip">0%</span>
      <span style="width:12px"></span>
      <label for="grainColor">Grain color:</label>
      <input id="grainColor" type="color" value="#f1f4ff" title="Pick the grain fill color">
    </div>

    <div class="row">
      <span>Time left (to last-cross):</span> <span id="leftCross" class="chip">—</span>
      <span style="width:10px"></span>
      <span>Time left (to end):</span> <span id="leftEnd" class="chip">—</span>
      <span id="warn"></span>
    </div>
  </main>

  <script>
  const $ = s => document.querySelector(s);
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const playBtn = $('#play'), pauseBtn = $('#pause');
  const slider = $('#slider'), fpsEl = $('#fps'), finfo = $('#finfo');
  const jumpBtn = $('#jump'), fileInp = $('#file');
  const alignSecInp = $('#alignSec'), resetAlignBtn = $('#resetAlign'), alignInfo = $('#alignInfo');
  const metaNote = $('#metaNote');
  const leftCross = $('#leftCross'), leftEnd = $('#leftEnd'), warn = $('#warn');
  const zoomCtl = $('#zoom'), zoomLbl = $('#zoomLbl');
  const panYCtl = $('#panY'), panYLbl = $('#panYLbl');
  const grainColorInput = $('#grainColor');

  let meta = null, frames = 0, grains = 0, baseFPS = 60, lastCrossFrame = null, Q = 32;
  let mode = "sparse"; // or dense
  let reader = null;
  let alive = [];
  let anim = null, cur = 0, effectiveFPS = 60, lastTick = 0, frameAcc = 0;

  const SENT = 65535; // death sentinel from baker
  let viewZoom = 1.0;     // multiplies fitted scale
  let panYFrac = 0.0;     // fraction of H (-1..+1), positive pans down
  let grainColor = '#f1f4ff';

  const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
  function fitScale() {
    const W = (meta.bulb*2 + 80), H2 = (meta.H*2 + 80);
    const sx = cv.width  / W;
    const sy = cv.height / H2;
    return Math.min(sx, sy);
  }
  const worldToScreen = (x,y) => {
    const s = fitScale() * viewZoom;
    const cx = cv.width/2, cy = cv.height/2;
    const py = (panYFrac * meta.H);
    return [cx + x * s, cy + (y + py) * s, s];
  };

  async function loadJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Failed to fetch JSON: ' + res.status);
    return await res.json();
  }
  function parseQuery() {
    const u = new URL(location.href);
    return u.searchParams.get('bake');
  }
  fileInp.addEventListener('change', async () => {
    const f = fileInp.files[0]; if (!f) return;
    const j = JSON.parse(await f.text());
    startWithJSON(j, null);
  });
  (async function initFromQuery(){
    const q = parseQuery();
    if (!q) return;
    try { startWithJSON(await loadJSON(q), q); }
    catch (e) { warn.textContent = 'Failed to load: ' + e.message; }
  })();

  function startWithJSON(json, baseHref) {
    meta = json.meta || {};
    frames = json.frames || 0;
    baseFPS = json.fps || meta.fps || 60;
    grains = meta.grains || 0;
    Q = meta.Q || 32;
    lastCrossFrame = json.lastCrossFrame ?? null;
    mode = (meta.mode || (json.bin ? 'dense':'sparse')) || 'sparse';

    metaNote.textContent = (lastCrossFrame==null ? 'lastCross not available.' : '') +
      ` Tilt (gravity only): ${Number(meta.tiltDeg||0).toFixed(2)}°`;

    fpsEl.textContent = baseFPS;
    slider.max = Math.max(0, frames-1);
    finfo.textContent = `0/${frames}`;
    alignInfo.textContent = '';
    leftCross.textContent = '—';
    leftEnd.textContent = '—';
    warn.textContent = '';

    alive = new Array(grains).fill(true);

    if (mode === 'dense') {
      const url = json.bin || json.u16 || json.data;
      if (!url) return fail('No data for dense');
      const abs = url.startsWith('/') || !baseHref ? url : new URL(url, baseHref).href;
      loadDense(abs);
    } else {
      const url = json.sbin;
      if (!url) return fail('No data for sparse');
      const abs = url.startsWith('/') || !baseHref ? url : new URL(url, baseHref).href;
      loadSparse(abs);
    }
  }
  function fail(msg){ warn.textContent = msg; }

  async function loadDense(url) {
    try {
      const buf = await (await fetch(url)).arrayBuffer();
      const u16 = new Uint16Array(buf);
      reader = {
        getFrame(i) {
          const arr = new Array(grains);
          let off = i * grains * 2;
          for (let g=0; g<grains; g++, off+=2) arr[g] = [u16[off], u16[off+1]];
          return arr;
        },
        seek(i){ /* noop */ }
      };
      cur = 0; drawFrame(cur);
    } catch (e) { fail('dense load error: ' + e.message); }
  }

  async function loadSparse(url) {
    try {
      const buf = await (await fetch(url)).arrayBuffer();
      const dv = new DataView(buf);
      if (String.fromCharCode(dv.getUint8(0),dv.getUint8(1),dv.getUint8(2),dv.getUint8(3))!=='HGSB') throw new Error('bad magic');
      const qh = dv.getUint16(4,true);
      const g = dv.getUint32(6,true);
      const f = dv.getUint32(10,true);
      if (qh!==Q) console.warn('Q in header != meta.Q; using header=', qh);
      if (g!==grains) grains = g;
      if (f!==frames) frames = f;
      slider.max = Math.max(0, frames-1); finfo.textContent = `0/${frames}`;

      const offs = new Uint32Array(frames);
      let p = 14;
      for (let i=0;i<frames;i++){
        offs[i] = p;
        const count = dv.getUint16(p, true); p+=2;
        for (let c=0;c<count;c++){
          let shift=0, idx=0, b;
          do { b=dv.getUint8(p++); idx |= (b&0x7f)<<shift; shift+=7; } while (b>=0x80);
          p += 4;
        }
      }

      const lastQ = new Uint16Array(grains*2);
      lastQ.fill(0);
      alive = new Array(grains).fill(true);

      const applyFrame = (i)=>{
        let p = offs[i];
        const count = dv.getUint16(p, true); p+=2;
        for (let c=0;c<count;c++){
          let shift=0, idx=0, b;
          do { b=dv.getUint8(p++); idx |= (b&0x7f)<<shift; shift+=7; } while (b>=0x80);
          const qx = dv.getUint16(p, true), qy = dv.getUint16(p+2, true); p+=4;
          if (qx===SENT && qy===SENT) { alive[idx]=false; continue; }
          alive[idx]=true;
          const off = idx*2; lastQ[off]=qx; lastQ[off+1]=qy;
        }
        return lastQ;
      };

      const SNAP = Math.max(1, Math.floor(240*60/baseFPS));
      const snaps = new Map();
      const makeSnap = (i, LQ) => snaps.set(i, { lastQ: new Uint16Array(LQ), alive: Uint8Array.from(alive, v=>v?1:0) });

      reader = {
        seek(target){
          target = clamp(target, 0, frames-1);
          let start = 0;
          for (const k of snaps.keys()) if (k<=target && k>start) start=k;
          let LQ;
          if (start===0 && !snaps.has(0)) {
            LQ = new Uint16Array(grains*2); LQ.fill(0); alive.fill(true);
            for (let i=0;i<=target;i++){ LQ = applyFrame(i); if (i%SNAP===0) makeSnap(i, LQ); }
          } else {
            const s = snaps.get(start);
            LQ = new Uint16Array(s.lastQ);
            alive = Array.from(s.alive, b=>!!b);
            for (let i=start+1;i<=target;i++){ LQ = applyFrame(i); if (i%SNAP===0) makeSnap(i, LQ); }
          }
          return LQ;
        },
        getFrame(i){ return this.seek(i); }
      };

      cur = 0; drawFrame(cur);
    } catch (e) { fail('sparse load error: ' + e.message); }
  }

  function xHalf(y) {
    const H = meta.H, neck = meta.neck, bulb = meta.bulb, c1 = Number(meta.c1||0), c2 = Number(meta.c2||0);
    const ay = Math.abs(y);
    const t = Math.min(1, ay / H);
    const bump = t * (1 - t);
    let s = t + c1*bump + c2*(2*bump*(t-0.5));
    s = Math.max(0, Math.min(1, s));
    return (neck/2) + (bulb - neck/2) * s;
  }
  function drawWalls() {
    const H = meta.H;
    ctx.strokeStyle = "#bfc7d8";
    ctx.lineWidth = 1;
    ctx.beginPath();
    const steps = 220;
    for (let i=0;i<=steps;i++){
      const y = -H + (2*H)*i/steps;
      const [xl,yl] = worldToScreen(-xHalf(y), y);
      if (i===0) ctx.moveTo(xl,yl); else ctx.lineTo(xl,yl);
    }
    for (let i=steps;i>=0;i--){
      const y = -H + (2*H)*i/steps;
      const [xr,yr] = worldToScreen(+xHalf(y), y);
      ctx.lineTo(xr,yr);
    }
    ctx.closePath();
    ctx.stroke();
  }
  function drawFrame(i) {
    if (!reader) return;
    const u16 = reader.getFrame(i);
    ctx.clearRect(0,0,cv.width,cv.height);
    drawWalls();

    const rad = Math.max(1, Math.round(meta.r || 2));
    ctx.fillStyle = grainColor;
    ctx.beginPath();
    for (let g=0; g<grains; g++){
      if (mode==='sparse' && !alive[g]) continue;
      const qx = u16[g*2], qy = u16[g*2+1];
      if (qx===0 && qy===0) continue;
      if (qx===SENT && qy===SENT) continue;
      const x = (qx / Q) - (meta.bulb + 5);
      const y = (qy / Q) - (meta.H + 5);
      const [sx,sy] = worldToScreen(x,y);
      ctx.moveTo(sx+rad, sy);
      ctx.arc(sx, sy, rad, 0, Math.PI*2);
    }
    ctx.fill();

    slider.value = i;
    finfo.textContent = `${i}/${frames}`;
    updateClocks(i);
  }

  // --- playback with accumulator (robust at any effectiveFPS) ---
  function tick(ts) {
    if (!reader) return;
    if (!lastTick) lastTick = ts;
    let dt = (ts - lastTick) / 1000;
    lastTick = ts;
    if (dt > 0.25) dt = 0.25; // tab sleep clamp

    frameAcc += effectiveFPS * dt;
    if (frameAcc >= 1) {
      const advance = Math.floor(frameAcc);
      frameAcc -= advance;
      const next = Math.min(cur + advance, frames - 1);
      if (next !== cur) { cur = next; drawFrame(cur); }
      if (cur >= frames - 1) { stop(); return; }
    }
    anim = requestAnimationFrame(tick);
  }
  function play() { stop(); lastTick = 0; frameAcc = 0; anim = requestAnimationFrame(tick); }
  function stop() { if (anim) cancelAnimationFrame(anim); anim = null; }

  // UI wiring
  playBtn.onclick = () => {
    if (!reader) return;
    // If we're at the end, restart from the beginning
    if (frames > 0 && cur >= frames - 1) {
      cur = 0;
      reader.seek(0);
      drawFrame(0);
    }
    play();
  };
  pauseBtn.onclick = () => stop();
  slider.oninput = () => { stop(); reader.seek(Number(slider.value)); cur = Number(slider.value); drawFrame(cur); };
  jumpBtn.onclick = () => { if (lastCrossFrame!=null){ stop(); cur = lastCrossFrame; reader.seek(cur); drawFrame(cur);} };

  // alignment -> effective FPS
  let alignSec = null;
  alignSecInp.addEventListener('input', () => {
    const v = Number(alignSecInp.value);
    alignSec = Number.isFinite(v) && v>0 ? v : null;
    computeEffectiveFPS();
  });
  resetAlignBtn.onclick = () => { alignSec = null; alignSecInp.value = ""; computeEffectiveFPS(); };

  function computeEffectiveFPS() {
    if (alignSec!=null && lastCrossFrame!=null && lastCrossFrame>0) {
      const lastCrossSec = lastCrossFrame / baseFPS;
      const factor = lastCrossSec / alignSec;            // <1 slower, >1 faster
      effectiveFPS = baseFPS * factor;
      if (!Number.isFinite(effectiveFPS) || effectiveFPS <= 0) effectiveFPS = baseFPS;
      alignInfo.textContent = `Playback scales so lastCross ≈ ${alignSec.toFixed(2)} s (eff FPS: ${effectiveFPS.toFixed(2)}).`;
    } else {
      effectiveFPS = baseFPS;
      alignInfo.textContent = '';
    }
    fpsEl.textContent = effectiveFPS.toFixed(2);
  }

  function updateClocks(i) {
    if (lastCrossFrame!=null) {
      const secsLeft = Math.max(0, (lastCrossFrame - i) / effectiveFPS);
      leftCross.textContent = secsLeft.toFixed(1);
    } else leftCross.textContent = '—';
    const endLeft = Math.max(0, (frames - 1 - i) / effectiveFPS);
    leftEnd.textContent = new Date(endLeft * 1000).toISOString().substr(14, 5);
  }

  // Zoom, Pan, Color
  function applyZoomUI() {
    const z = Number(zoomCtl.value) || 100;
    viewZoom = z / 100;
    zoomLbl.textContent = `${z}%`;
    drawFrame(cur||0);
  }
  function applyPanUI() {
    const p = Number(panYCtl.value) || 0;
    panYFrac = p / 100;
    panYLbl.textContent = `${p}%`;
    drawFrame(cur||0);
  }
  function applyGrainColor() {
    grainColor = grainColorInput.value || '#f1f4ff';
    drawFrame(cur||0);
  }
  zoomCtl.addEventListener('input', applyZoomUI);
  panYCtl.addEventListener('input', applyPanUI);
  grainColorInput.addEventListener('input', applyGrainColor);

  // resize canvas to devicePixelRatio
  function resizeCanvas() {
    const pr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = Math.round(w * pr);
    cv.height = Math.round(h * pr);
    ctx.setTransform(pr,0,0,pr,0,0);
    drawFrame(cur||0);
  }
  new ResizeObserver(resizeCanvas).observe(cv);

  // init labels once
  applyZoomUI();
  applyPanUI();
  applyGrainColor();
  </script>
</body>
</html>
