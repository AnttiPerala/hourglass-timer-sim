<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hourglass Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#0b0b0b; --fg:#f5f5f5; --muted:#a3a3a3; --line:#1f2937; --accent:#60a5fa; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    header h1 { margin:0; font-size:16px; font-weight:700; }
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .controls input[type="range"] { width:240px; }
    .chip { background:#111827; border:1px solid #374151; color:#e5e7eb; padding:3px 8px; border-radius:10px; font-size:12px; }
    .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .spacer { flex:1; }
    .muted { color: var(--muted); }
    .panel { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
    #drop { display:inline-flex; align-items:center; gap:8px; background:#111827; border:1px dashed #374151; padding:6px 10px; border-radius:8px; cursor:pointer; }
    #msg { padding:10px 16px; color:#fca5a5; }
    canvas { display:block; width:100%; height:auto; background:#0b0b0b; }
    a { color: var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <header>
    <h1>Hourglass Player</h1>
    <div class="controls">
      <button id="btnPlay">Play</button>
      <button id="btnPause">Pause</button>
      <label>Frame <input id="range" type="range" min="0" max="0" value="0"></label>
      <span id="lblFrame" class="chip">0 / 0</span>
      <span id="lblFps" class="chip">fps: 0</span>
      <button id="btnJump" title="Jump to lastCrossFrame if available">Jump to lastCross</button>
      <span id="clock" class="chip" title="Seconds left (aligned to lastCross if available)">00:00</span>
      <div class="spacer"></div>
      <div class="row">
        <label for="url">Open bake URL:</label>
        <input id="url" placeholder="/bakes/your-bake.json" size="36">
        <button id="btnOpen">Open</button>
      </div>
      <label id="drop">
        <input id="file" type="file" accept=".json,application/json" hidden>
        <span>Open JSON file…</span>
      </label>
    </div>
  </header>

  <div id="msg"></div>
  <canvas id="c"></canvas>

  <script>
  // ----- state -----
  let ctx, canvas;
  let meta = null;
  let frames = 0;
  let fps = 0;
  let lastCrossFrame = null;
  let Q = 32;
  let rPx = 2;
  let denseData = null; // Uint16Array for dense
  let sparse = null;    // sparse reader
  let playing = false;
  let cur = 0;
  let jsonBase = null;  // base URL of the loaded JSON (for resolving bin/sbin)
  let alignSeconds = null; // computed from lastCross and desired total
  let rafId = null;

  const $ = (id) => document.getElementById(id);
  function showErr(s){ $("msg").textContent = "Failed to load: " + s; }
  function clearMsg(){ $("msg").textContent = ""; }

  // ----- URL helpers -----
  const normPath = (p) => String(p).replace(/\\\\/g,'/').replace(/\\+/g,'/'); // normalize backslashes

  function getQuery(name){
    const u = new URL(location.href);
    return u.searchParams.get(name);
  }

  // ----- sbin decoding (HGSB u16 Q, u32 grains, u32 frames; per frame: u16 count, records of varint index + u16 qx + u16 qy) -----
  function makeSparseReader(buffer){
    const dv = new DataView(buffer);
    let off = 0;
    function readU8(){ const v = dv.getUint8(off); off+=1; return v; }
    function readU16(){ const v = dv.getUint16(off, true); off+=2; return v; }
    function readU32(){ const v = dv.getUint32(off, true); off+=4; return v; }
    function readVarint(){
      let x = 0, s = 0, b;
      do { b = readU8(); x |= (b & 0x7f) << s; s += 7; } while (b & 0x80);
      return x >>> 0;
    }

    // header
    const magic = String.fromCharCode(readU8(),readU8(),readU8(),readU8());
    if (magic !== "HGSB") throw new Error("bad magic");
    const q = readU16();
    const grains = readU32();
    const totalFrames = readU32();

    // index offsets per frame (so we can jump)
    const frameOffsets = new Uint32Array(totalFrames);
    frameOffsets[0] = off;
    // walk once to collect offsets (small and fast)
    for (let f=0; f<totalFrames; f++){
      const start = off;
      const count = readU16();
      for (let i=0;i<count;i++){
        readVarint(); // idx
        off += 2 + 2; // qx,qy
      }
      if (f+1 < totalFrames) frameOffsets[f+1] = off;
    }

    // last-known positions, filled lazily
    const last = new Uint16Array(grains*2);
    let lastFrameApplied = -1;

    function applyFrame(target){
      if (target < 0) target = 0;
      if (target >= totalFrames) target = totalFrames-1;
      // If moving backward, reset and replay
      if (target < lastFrameApplied){
        last.fill(0);
        lastFrameApplied = -1;
      }
      for (let f = lastFrameApplied+1; f <= target; f++){
        let k = frameOffsets[f];
        const count = new DataView(buffer).getUint16(k, true); k+=2;
        let ptr = k;
        for (let i=0; i<count; i++){
          // read varint idx
          let x=0, s=0, b;
          do { b = new DataView(buffer).getUint8(ptr); ptr+=1; x |= (b & 0x7f) << s; s += 7; } while (b & 0x80);
          const idx = x >>> 0;
          const qx = new DataView(buffer).getUint16(ptr, true); ptr+=2;
          const qy = new DataView(buffer).getUint16(ptr, true); ptr+=2;
          const base = idx*2;
          last[base] = qx;
          last[base+1] = qy;
        }
      }
      lastFrameApplied = target;
      return last;
    }

    return { grains, frames: totalFrames, Q:q, last, applyFrame };
  }

  // ----- load JSON (from URL or File) -----
  async function loadJSON(urlOrFile){
    try {
      clearMsg();
      let json;
      if (typeof urlOrFile === "string"){
        const res = await fetch(urlOrFile);
        if (!res.ok) throw new Error("HTTP "+res.status);
        json = await res.json();
        jsonBase = new URL(urlOrFile, location.href);
      } else {
        const txt = await urlOrFile.text();
        json = JSON.parse(txt);
        jsonBase = new URL(location.href);
      }

      // meta
      meta = json.meta || {};
      fps = Number(json.fps || (meta && meta.fps)) || 60;
      frames = Number(json.frames) || 0;
      lastCrossFrame = (json.lastCrossFrame ?? null);
      Q = Number((meta && meta.Q) || json.Q) || 32;
      rPx = Number(meta && meta.r) || 2;

      // dense/sparse/data
      denseData = null; sparse = null;

      const norm = (p) => normPath(p);

      if (json.data){
        const bytes = atob(json.data);
        const buf = new Uint8Array(bytes.length);
        for (let i=0;i<bytes.length;i++) buf[i] = bytes.charCodeAt(i);
        denseData = new Uint16Array(buf.buffer);
      } else if (Array.isArray(json.u16)){
        denseData = new Uint16Array(json.u16);
      } else if (json.bin){
        const binUrl = new URL(norm(json.bin), jsonBase);
        const res = await fetch(binUrl);
        if (!res.ok) throw new Error("bin fetch "+res.status);
        const buf = await res.arrayBuffer();
        denseData = new Uint16Array(buf);
      } else if (json.sbin){
        const sbinUrl = new URL(norm(json.sbin), jsonBase);
        const res = await fetch(sbinUrl);
        if (!res.ok) throw new Error("sbin fetch "+res.status);
        const buf = await res.arrayBuffer();
        sparse = makeSparseReader(buf);
        // prefer header values if present
        if (!frames && sparse.frames) frames = sparse.frames;
        if (!Q && sparse.Q) Q = sparse.Q;
      } else {
        showErr("No data/u16/bin/sbin found in JSON");
        return;
      }

      // setup canvas
      initCanvas();
      // UI
      $("lblFps").textContent = "fps: " + fps;
      $("range").max = String(Math.max(0, frames-1));
      $("lblFrame").textContent = `${cur} / ${frames-1}`;
      // compute clock alignment if lastCross present (align to whole minutes default 60s)
      updateClock();

      draw();
    } catch (e) {
      showErr(String(e.message || e));
      console.error(e);
    }
  }

  function initCanvas(){
    canvas = $("c");
    ctx = canvas.getContext("2d");
    // fit width to container, compute height from H
    const H = Number(meta && meta.H) || 500;
    const bulb = Number(meta && meta.bulb) || 220;
    const pad = 40;
    const w = bulb*2 + pad*2;
    const h = H*2 + pad*2;
    const ratio = (window.devicePixelRatio || 1);
    canvas.width = Math.round(w * ratio);
    canvas.height = Math.round(h * ratio);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(ratio,0,0,ratio,0,0);
  }

  // ----- rendering helpers -----
  function xHalf(y){
    const H = Number(meta && meta.H) || 500;
    const neck = Number(meta && meta.neck) || 12;
    const bulb = Number(meta && meta.bulb) || 220;
    const c1 = Number(meta && meta.c1) || 0;
    const c2 = Number(meta && meta.c2) || 0;
    const ay = Math.abs(y);
    const t = Math.min(1, ay / H);
    const bump = t*(1-t);
    let s = t + c1 * bump + c2 * (2 * bump * (t - 0.5));
    s = Math.max(0, Math.min(1, s));
    return (neck/2) + (bulb - neck/2) * s;
  }

  function drawOutline(){
    if (!meta) return;
    const H = Number(meta.H || 500);
    const bulb = Number(meta.bulb || 220);
    const pad = 40;
    const cx = pad + bulb;
    const cy = pad + H;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.beginPath();
    const segs = 140;
    for (let i=0;i<=segs;i++){
      const y = -H + (2*H)*i/segs;
      const x = xHalf(y);
      const X = x, Y = y;
      if (i===0) ctx.moveTo(+X, Y); else ctx.lineTo(+X, Y);
    }
    for (let i=segs;i>=0;i--){
      const y = -H + (2*H)*i/segs;
      const x = -xHalf(y);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  function quantToXY(i){
    const bulb = Number(meta && meta.bulb) || 220;
    const H = Number(meta && meta.H) || 500;
    const qx = (denseData[i] ?? 0);
    const qy = (denseData[i+1] ?? 0);
    const x = qx / Q - bulb - 5;
    const y = qy / Q - H - 5;
    return [x,y];
  }

  function quantToXYFromLast(last, base){
    const bulb = Number(meta && meta.bulb) || 220;
    const H = Number(meta && meta.H) || 500;
    const qx = last[base];
    const qy = last[base+1];
    const x = qx / Q - bulb - 5;
    const y = qy / Q - H - 5;
    return [x,y];
  }

  function draw(){
    if (!ctx) return;
    const H = Number(meta && meta.H) || 500;
    const bulb = Number(meta && meta.bulb) || 220;
    const pad = 40;
    const cx = pad + bulb;
    const cy = pad + H;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawOutline();

    ctx.save();
    ctx.translate(cx, cy);
    const rad = Number(rPx) || 2;

    if (denseData){
      const base = cur * (frames>0 ? (denseData.length / frames) : 0);
      // draw grains
      for (let i=0; i< (denseData.length/frames); i+=2){
        const [x,y] = quantToXY(base + i);
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI*2);
        ctx.fillStyle = "#e5e7eb";
        ctx.fill();
      }
    } else if (sparse){
      const last = sparse.applyFrame(cur);
      const grains = last.length/2;
      for (let gi=0; gi<grains; gi++){
        const [x,y] = quantToXYFromLast(last, gi*2);
        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI*2);
        ctx.fillStyle = "#e5e7eb";
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function tick(){
    if (!playing) return;
    cur = Math.min(frames-1, cur+1);
    $("range").value = String(cur);
    $("lblFrame").textContent = `${cur} / ${frames-1}`;
    updateClock();
    draw();
    if (cur >= frames-1){ playing = false; return; }
    rafId = requestAnimationFrame(tick);
  }

  function updateClock(){
    // If lastCross known, show time-to-lastCross (positive) or since (negative)
    if (lastCrossFrame == null){
      $("clock").textContent = "—";
      return;
    }
    const secTo = (lastCrossFrame - cur) / (fps || 1);
    const s = Math.max(0, Math.round(secTo));
    const mm = String(Math.floor(s/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    $("clock").textContent = `${mm}:${ss}`;
  }

  // ----- UI -----
  $("btnPlay").onclick = () => { if (frames>0 && !playing){ playing = true; cancelAnimationFrame(rafId); rafId = requestAnimationFrame(tick); }};
  $("btnPause").onclick = () => { playing = false; cancelAnimationFrame(rafId); };
  $("range").oninput = (e) => { playing = false; cur = Number(e.target.value)||0; $("lblFrame").textContent = `${cur} / ${frames-1}`; updateClock(); draw(); };
  $("btnJump").onclick = () => { if (lastCrossFrame != null){ cur = Math.min(frames-1, Math.max(0, lastCrossFrame)); $("range").value = String(cur); $("lblFrame").textContent = `${cur} / ${frames-1}`; updateClock(); draw(); }};
  $("btnOpen").onclick = () => {
    const u = $("url").value.trim();
    if (!u) return;
    loadJSON(u);
  };
  $("file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    loadJSON(f);
  });

  // auto-load if ?bake= is present
  const bake = getQuery("bake");
  if (bake) {
    $("url").value = bake;
    loadJSON(bake);
  }
  </script>
</body>
</html>
