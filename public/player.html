<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Hourglass Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:980px;margin:20px auto;padding:0 16px;}
    canvas{border:1px solid #ccc;border-radius:8px;display:block;margin:8px 0;max-width:100%;image-rendering:pixelated;}
    .ctrls{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .msg{padding:8px 12px;border-radius:8px;background:#fee;border:1px solid #f99;display:none}
    input[type="number"]{width:120px; padding:6px 8px; border:1px solid #ccc; border-radius:8px;}
    button{padding:8px 12px; border:0; border-radius:8px; background:#111; color:#fff; cursor:pointer;}
    button.secondary{background:#666}
    .muted{color:#666}
    .clock{font-variant-numeric: tabular-nums; font-weight:700;}
    .clock-label{color:#444}
    .clock-box{display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
  </style>
</head>
<body>
  <h1>Hourglass Player</h1>
  <div class="ctrls">
    <label>Open JSON: <input type="file" id="file" accept="application/json"></label>
    <span id="lcInfo" class="muted" style="margin-left:auto"></span>
  </div>
  <p id="err" class="msg"></p>
  <canvas id="cv" width="720" height="720"></canvas>

  <div class="ctrls">
    <button id="play">Play</button>
    <button id="pause" class="secondary">Pause</button>
    <label>Frame: <input id="slider" type="range" min="0" max="0" step="1" value="0"></label>
    <span id="finfo">0/0</span>
    <span>Base FPS: <b id="fpsVal">0</b></span>
    <span>Effective FPS: <b id="effFpsVal">0</b></span>
    <button id="jump">Jump to lastCrossFrame</button>
  </div>

  <div class="ctrls">
    <label>Align last-cross to (s):
      <input id="alignSec" type="number" step="0.1" placeholder="e.g. 60">
    </label>
    <button id="align60" class="secondary">60s</button>
    <button id="alignReset" class="secondary">Reset alignment</button>
    <span class="muted">Playback rate scales so lastCross lands exactly at this time (if known).</span>
  </div>

  <div class="clock-box">
    <span class="clock-label">Time left (to last-cross):</span>
    <span id="clockLC" class="clock">—</span>
    <span class="clock-label">Time left (to end):</span>
    <span id="clockEnd" class="clock">—</span>
  </div>

<script>
const $ = (s)=>document.querySelector(s);
function showErr(msg){ const el=$("#err"); el.textContent=msg; el.style.display="block"; }

const urlParams = new URLSearchParams(location.search);
const bakeUrl = urlParams.get("bake");

let meta=null, frames=0, fps=0, lastCrossFrame=null, Q=32, bulb=220, H=500, neck=12, c1=0, c2=0, slat=0, tiltDeg=0, grainR=2;
let mode="dense";
let denseData=null; // Uint16Array
let sparse=null;    // sparse reader
let alignSec=null;  // seconds to align lastCross to
let tick=null, cur=0, playing=false;

// ---- same curve as bake.js (walls are not rotated visually) ----
function xHalf(y) {
  const ay = Math.abs(y);
  const t = Math.min(1, ay / H);
  const bump = t * (1 - t);
  let s = t + c1 * bump + c2 * (2 * bump * (t - 0.5));
  s = Math.max(0, Math.min(1, s));
  return (neck / 2) + (bulb - neck / 2) * s;
}

// Sparse reader that streams per-frame changes
function makeSparseReader(buf){
  const dv = new DataView(buf);
  let off=0;
  function rdU8(){ const v=dv.getUint8(off); off+=1; return v; }
  function rdU16(){ const v=dv.getUint16(off, true); off+=2; return v; }
  function rdU32(){ const v=dv.getUint32(off, true); off+=4; return v; }
  function rdVar(){ let shift=0,n=0; while(true){ const b=rdU8(); n |= (b & 0x7f) << shift; if((b&0x80)===0) break; shift+=7; } return n>>>0; }

  const m = String.fromCharCode(rdU8(), rdU8(), rdU8(), rdU8());
  if (m !== "HGSB") throw new Error("Bad sparse magic");
  const q = rdU16(); const grains = rdU32(); const fr = rdU32();
  const last = new Uint16Array(grains*2);
  let frameIdx=0;
  return {
    grains, q, frames: fr,
    getFrame(i){ if (i<frameIdx) { off = 4+2+4+4; frameIdx=0; last.fill(0); }
      while(frameIdx <= i){
        if (frameIdx === fr) break;
        const count = rdU16();
        for(let k=0;k<count;k++){
          const idx = rdVar();
          const qx = rdU16();
          const qy = rdU16();
          last[idx*2] = qx;
          last[idx*2+1] = qy;
        }
        frameIdx++;
      }
      return last;
    }
  };
}

async function loadJSON(urlOrFile){
  try {
    let json;
    if (typeof urlOrFile === "string"){
      const res = await fetch(urlOrFile);
      if (!res.ok) throw new Error("HTTP "+res.status);
      json = await res.json();
    } else {
      const txt = await urlOrFile.text();
      json = JSON.parse(txt);
    }
    meta = json.meta || {};
    frames = json.frames || 0;
    fps = json.fps || 60;
    lastCrossFrame = json.lastCrossFrame ?? null;

    // meta values (with sane defaults)
    Q = meta.Q ?? 32;
    bulb = meta.bulb ?? 220;
    H = meta.H ?? 500;
    neck = meta.neck ?? 12;
    c1 = meta.c1 ?? 0;
    c2 = meta.c2 ?? 0;
    slat = meta.slat ?? 0;
    tiltDeg = meta.tiltDeg ?? 0; // used only for info; not rotating visuals
    grainR = meta.r ?? 2;

    mode = meta.mode || (json.bin ? "dense" : json.sbin ? "sparse" : "legacy");
    $("#fpsVal").textContent = fps;
    $("#slider").max = Math.max(0, frames-1);
    $("#finfo").textContent = `0/${Math.max(0, frames-1)}`;

    if (json.data){
      const bin = atob(json.data);
      const arr = new Uint16Array(bin.length/2);
      for(let i=0;i<arr.length;i++) arr[i] = (bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1)<<8));
      denseData = arr;
    } else if (Array.isArray(json.u16)){
      denseData = new Uint16Array(json.u16);
    } else if (json.bin){
      const res = await fetch(json.bin);
      if (!res.ok) throw new Error("bin fetch "+res.status);
      const buf = await res.arrayBuffer();
      denseData = new Uint16Array(buf);
    } else if (json.sbin){
      const res = await fetch(json.sbin);
      if (!res.ok) throw new Error("sbin fetch "+res.status);
      const buf = await res.arrayBuffer();
      sparse = makeSparseReader(buf);
    } else {
      showErr("No data/u16/bin/sbin provided in bake — using empty buffer");
    }

    // lastCross info
    const tActual = (lastCrossFrame != null) ? (lastCrossFrame / fps) : null;
    $("#lcInfo").textContent = (tActual != null)
      ? `lastCross at frame ${lastCrossFrame} (${tActual.toFixed(2)} s). Tilt (gravity only): ${tiltDeg.toFixed(2)}°`
      : `lastCross not available. Tilt (gravity only): ${tiltDeg.toFixed(2)}°`;

    updateEffFpsDisplay();
    updateClocks();
  } catch (e) {
    showErr("Failed to load: " + e.message);
  }
}

const cv = $("#cv"), ctx = cv.getContext("2d");

function drawOutline(s){
  // Pixel-constant stroke: set width in world units as 1/s
  ctx.save();
  ctx.lineWidth = 1 / s;
  ctx.strokeStyle = "#999";
  ctx.beginPath();
  const segs = 200;
  // Right side: y = -H .. +H
  for (let i=0;i<=segs;i++){
    const y = -H + (2*H)*(i/segs);
    const x = xHalf(y);
    if (i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  // Left side back: y = +H .. -H
  for (let i=segs;i>=0;i--){
    const y = -H + (2*H)*(i/segs);
    const x = -xHalf(y);
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  if (slat > 0){
    ctx.beginPath();
    ctx.moveTo(-slat/2, 0);
    ctx.lineTo( slat/2, 0);
    ctx.stroke();
  }
  ctx.restore();
}

function drawFrame(f){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  const worldW = (bulb*2 + 40);
  const worldH = (H*2 + 40);
  const sx = cv.width / worldW;
  const sy = cv.height / worldH;
  const s = Math.min(sx, sy);
  ctx.translate(cv.width/2, cv.height/2);
  ctx.scale(s, s);

  // NOTE: We do NOT rotate visuals by tiltDeg anymore.
  // Tilt influences gravity in the bake only.

  // Outline first
  drawOutline(s);

  // Grains — radius in world units (scales with s)
  const drawOne = (x, y) => {
    ctx.beginPath();
    ctx.arc(x, y, grainR, 0, Math.PI*2);
    ctx.fill();
  };

  ctx.fillStyle = "#111";
  if (denseData){
    const grains = (meta && meta.grains) ? meta.grains : (denseData.length / Math.max(1, frames*2));
    const base = f * grains * 2;
    for (let i=0;i<grains;i++){
      const qx = denseData[base + i*2];
      const qy = denseData[base + i*2 + 1];
      const x = qx / Q - bulb - 5;
      const y = qy / Q - H - 5;
      drawOne(x, y);
    }
  } else if (sparse){
    const qbuf = sparse.getFrame(f);
    for (let i=0;i<qbuf.length;i+=2){
      const x = qbuf[i] / Q - bulb - 5;
      const y = qbuf[i+1] / Q - H - 5;
      drawOne(x, y);
    }
  }
  ctx.restore();
}

// --- Alignment logic ---
function getPlaybackRate(){
  if (alignSec == null || !isFinite(alignSec) || alignSec <= 0 || lastCrossFrame == null) return 1;
  const tActual = lastCrossFrame / fps;
  const m = tActual / alignSec; // scale so lastCross lands at alignSec
  return m > 0 ? m : 1;
}
function updateEffFpsDisplay(){
  const eff = fps * getPlaybackRate();
  $("#effFpsVal").textContent = eff.toFixed(2);
}

// --- Digital clocks ---
function fmtClock(s){
  if (!isFinite(s) || s < 0) s = 0;
  const mm = Math.floor(s / 60);
  const ss = Math.floor(s % 60);
  const tenths = Math.floor((s - Math.floor(s)) * 10);
  return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}.${tenths}`;
}
function updateClocks(){
  const eff = fps * getPlaybackRate();
  if (frames > 0 && eff > 0){
    // to last-cross
    if (lastCrossFrame != null){
      const remFramesLC = Math.max(0, lastCrossFrame - cur);
      const secLC = remFramesLC / eff;
      $("#clockLC").textContent = fmtClock(secLC);
    } else {
      $("#clockLC").textContent = "—";
    }
    // to end
    const remFramesEnd = Math.max(0, (frames - 1) - cur);
    const secEnd = remFramesEnd / eff;
    $("#clockEnd").textContent = fmtClock(secEnd);
  } else {
    $("#clockLC").textContent = "—";
    $("#clockEnd").textContent = "—";
  }
}

// --- Playback ---
function startTick(){
  stopTick();
  const interval = 1000 / Math.max(1e-6, fps * getPlaybackRate());
  tick = setInterval(()=>{
    if (frames <= 0) return;
    cur = (cur+1) % frames;
    $("#slider").value = cur;
    $("#finfo").textContent = `${cur}/${frames-1}`;
    drawFrame(cur);
    updateClocks();
  }, interval);
}
function stopTick(){ if (tick){ clearInterval(tick); tick=null; } }

function play(){ if (playing || frames<=0) return; playing=true; startTick(); }
function pause(){ playing=false; stopTick(); }

$("#play").onclick = play;
$("#pause").onclick = pause;
$("#slider").oninput = (e)=>{
  cur = Number(e.target.value);
  $("#finfo").textContent = `${cur}/${frames-1}`;
  drawFrame(cur);
  updateClocks();
};
$("#jump").onclick = ()=>{
  if (lastCrossFrame!=null){
    cur = Math.min(lastCrossFrame, frames-1);
    $("#slider").value = cur;
    drawFrame(cur);
    updateClocks();
  }
};

// Alignment controls (always enabled)
$("#alignSec").addEventListener("input", (e)=>{
  const v = Number(e.target.value);
  alignSec = (isFinite(v) && v > 0) ? v : null;
  updateEffFpsDisplay();
  updateClocks();
  if (playing) startTick();
});
$("#align60").addEventListener("click", ()=>{
  alignSec = 60;
  $("#alignSec").value = String(alignSec);
  updateEffFpsDisplay();
  updateClocks();
  if (playing) startTick();
});
$("#alignReset").addEventListener("click", ()=>{
  alignSec = null;
  $("#alignSec").value = "";
  updateEffFpsDisplay();
  updateClocks();
  if (playing) startTick();
});

$("#file").addEventListener("change", (e)=>{
  const f = e.target.files[0];
  if (f) loadJSON(f).then(()=>{
    drawFrame(0);
    updateEffFpsDisplay();
    updateClocks();
  });
});

(async function init(){
  if (bakeUrl){
    await loadJSON(bakeUrl);
    drawFrame(0);
    updateEffFpsDisplay();
    updateClocks();
  }
})();
</script>
</body>
</html>
