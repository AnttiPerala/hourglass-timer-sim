<!doctype html>
<meta charset="utf-8">
<title>Bake UI — Sparse (Replacement + Sleep Controls)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0b0c10;--text:#e8ecf1;--muted:#9aa3ad;--card:#11131a;--line:#20232b;--ok:#2e7d32;--err:#c62828}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px system-ui}
  .wrap{max-width:980px;margin:auto;padding:18px}
  h1{font-size:18px;margin:0 0 12px;color:#dbe4ee}
  .grid{display:grid;grid-template-columns:repeat(4, minmax(160px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  label{display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)}
  input{padding:8px;border-radius:8px;border:1px solid #1f2430;background:#0f1219;color:var(--text)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
  button{background:#141823;border:1px solid #2a2f3a;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer}
  .log{background:#0f1219;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:160px;max-height:40vh;overflow:auto;white-space:pre-wrap;font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}
  .mono{font:12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace}
  .muted{color:var(--muted)}
  progress{width:100%;height:14px}
  .ok{color:var(--ok)} .err{color:var(--err)}
  a{color:#4fc3f7;text-decoration:none}
</style>

<div class="wrap">
  <h1>Bake UI — Sparse (Replacement + Sleep)</h1>

  <div class="card grid" role="form" aria-label="Bake settings">
    <label>Duration (s)<input id="duration" type="number" min="1" step="1" value="60"></label>
    <label>FPS<input id="fps" type="number" min="1" step="1" value="30"></label>
    <label>Grains<input id="grains" type="number" min="10" step="10" value="3500"></label>
    <label>Fullness (0–1)<input id="full" type="number" min="0" max="1" step="0.01" value="0.92"></label>

    <label>Neck (px)<input id="neck" type="number" min="4" step="1" value="12"></label>
    <label>H (px)<input id="H" type="number" min="100" step="10" value="520"></label>
    <label>Bulb radius (px)<input id="bulb" type="number" min="10" step="1" value="94"></label>
    <label>Grain r (px)<input id="r" type="number" min="1" step="0.1" value="2.0"></label>

    <label>k (stiffness)<input id="k" type="number" min="0.1" step="0.05" value="1.5"></label>
    <label>Tilt (deg)<input id="tiltDeg" type="number" min="0" max="5" step="0.1" value="1.2"></label>
    <label>Wall slat (px)<input id="slat" type="number" min="2" max="12" step="1" value="4"></label>
    <label>Flush max sec<input id="flushMaxSec" type="number" min="0" step="1" value="20"></label>

    <label>Sleep velocity (px/s)<input id="sleepVel" type="number" step="0.01" value="0.05"></label>
    <label>Sleep after (ms)<input id="sleepMs" type="number" step="10" value="3000"></label>
    <div></div><div></div>
  </div>

  <div class="row">
    <label class="row" style="gap:6px;align-items:center">
      <input id="noFlush" type="checkbox"> <span class="muted">Stop exactly at target (no flush)</span>
    </label>
    <button id="start">Start bake</button>
    <button id="list">List bakes</button>
    <span class="muted mono">Status: <span id="status">idle</span></span>
  </div>

  <progress id="bar" max="100" value="0"></progress>
  <div class="row mono"><span id="pct">0%</span> • <span id="frame">0/0</span> • <span id="rid" class="muted"></span></div>

  <div class="card log mono" id="log" aria-live="polite"></div>

  <div class="card" id="links" style="display:none">
    <div class="row">
      <span class="ok">Done.</span>
      <a id="openFile" href="#" target="_blank" rel="noopener">Open JSON</a>
      <a id="openPlayer" href="#" target="_blank" rel="noopener">Open player</a>
    </div>
  </div>
</div>

<script>
const qs = id => document.getElementById(id);
const logEl = qs('log'), statusEl = qs('status'), linksEl = qs('links');
const bar = qs('bar'), pctEl = qs('pct'), frameEl = qs('frame'), ridEl = qs('rid');
const openFile = qs('openFile'), openPlayer = qs('openPlayer');

function log(msg){ const t=new Date().toLocaleTimeString(); logEl.textContent += `[${t}] ${msg}
`; logEl.scrollTop = logEl.scrollHeight; }
function val(id){ return +qs(id).value; }

let es;

async function startBake(){
  linksEl.style.display = 'none';
  statusEl.textContent = 'starting…';
  ridEl.textContent = '';
  bar.value = 0; pctEl.textContent = '0%'; frameEl.textContent = '0/0';
  log('Starting bake…');

  const body = {
    duration: val('duration'),
    fps: val('fps'),
    grains: val('grains'),
    full: +qs('full').value,
    neck: val('neck'),
    H: val('H'),
    bulb: val('bulb'),
    r: +qs('r').value,
    k: +qs('k').value,
    tiltDeg: +qs('tiltDeg').value,
    slat: val('slat'),
    flushMaxSec: val('flushMaxSec'),
    sleepVel: +qs('sleepVel').value,
    sleepMs: +qs('sleepMs').value,
    noFlush: qs('noFlush').checked
  };

  try{
    const res = await fetch('/api/bake', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if(!res.ok){ statusEl.textContent='error'; log('HTTP '+res.status+' from /api/bake'); return; }
    const j = await res.json();
    const id = j.id || j.taskId;
    if(!id){ statusEl.textContent='error'; log('No id in response: '+JSON.stringify(j)); return; }
    ridEl.textContent = 'id='+id;

    if(es) try{ es.close(); }catch{}
    const url = '/api/stream/'+encodeURIComponent(id);
    log('Connecting EventSource '+url);
    es = new EventSource(url);
    es.onopen = () => { statusEl.textContent='connected'; log('[es] open'); };
    es.onerror = (e) => { statusEl.textContent='error'; log('[es] error; readyState='+es.readyState); };

    es.addEventListener('hello', e => log('[hello] '+e.data));
    es.addEventListener('meta', e => log('[meta] '+e.data));
    es.addEventListener('log', e => log('[log] '+e.data));
    es.addEventListener('progress', e => {
      try{
        const p = JSON.parse(e.data);
        const pct = Math.max(0, Math.min(100, +p.pct||0));
        bar.value = pct; pctEl.textContent = pct.toFixed(0)+'%';
        frameEl.textContent = (p.frame||0)+'/' + (p.target||0);
        statusEl.textContent = 'running';
      }catch(err){ log('[progress parse error] '+err.message+' data='+e.data); }
    });
    es.addEventListener('done', e => {
      statusEl.textContent = 'done';
      log('[done] '+e.data);
      try{
        const d = JSON.parse(e.data);
        linksEl.style.display = 'block';
        openFile.href = d.file;
        openFile.textContent = d.file;
        const abs = new URL(d.file, location.origin).toString();
        openPlayer.href = '/player_sparse.html?bake='+encodeURIComponent(abs);
      }catch{}
      try{ es.close(); }catch{}
    });
    es.addEventListener('exit', e => log('[exit] '+e.data));
  }catch(err){
    statusEl.textContent = 'error'; log('ERROR: '+err.message);
  }
}

qs('start').onclick = startBake;

qs('list').onclick = async () => {
  try{
    const res = await fetch('/api/index', {cache:'no-store'});
    if(!res.ok){ log('HTTP '+res.status+' from /api/index'); return; }
    const list = await res.json();
    if(!Array.isArray(list)){ log('index.json not array'); return; }
    log('Bakes (index.json):
' + list.map(x => '  '+(x.label||x.file)).join('
'));
  }catch(err){ log('List error: '+err.message); }
};
</script>
