<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hourglass Baker</title>
  <style>
    :root { --panel:#0f141b; --ink:#e7edf5; --line:#1f2733; --muted:#9fb2cc; --accent:#1952ff; }
    html, body { height:100%; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, sans-serif;
           margin: 0; background:#0b0d10; color:var(--ink); }
    header { padding: 12px 16px; background:#10151b; border-bottom:1px solid #1c2430; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:2; }
    h1 { font-size: 18px; margin: 0; font-weight: 600; }
    main { display:grid; grid-template-columns: 440px 1fr; gap: 16px; padding: 16px; }
    fieldset { border:1px solid var(--line); border-radius:10px; padding:12px; margin:0 0 12px; }
    legend { padding: 0 6px; color:var(--muted); }
    label { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0; }
    label span { color:#c8d7ea; font-size:13px; }
    input, select { width: 150px; padding:6px 8px; background:var(--panel); color:var(--ink); border:1px solid #273142; border-radius:8px; }
    input[type="checkbox"] { width:auto; }
    .row { display:flex; gap:8px; align-items:center; }
    .btn { background:var(--accent); color:white; border:none; border-radius:10px; padding:10px 14px; font-weight:600; cursor:pointer; }
    .muted { color:var(--muted); font-size:13px; }
    #log { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; height:340px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
    #progressWrap { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
    progress { width:100%; height:16px; }
    a { color:#9ad1ff; }
    details summary { cursor:pointer; color:#c8d7ea; }
  </style>
</head>
<body>
  <header>
    <h1>Hourglass Baker</h1>
    <div class="row">
      <button id="startBtn" class="btn">Start bake</button>
      <a href="/public/index.html" class="btn" style="background:#273142">List bakes</a>
    </div>
    <div style="margin-left:auto" class="muted" id="status">idle</div>
  </header>

  <main>
    <section>
      <form id="form">
        <fieldset>
          <legend>Timing & Output</legend>
          <label title="Length of simulation in seconds.">
            <span>duration (s)</span><input name="duration" type="number" step="1" min="1" value="10">
          </label>
          <label title="Bake frames per second. Higher = smoother + heavier.">
            <span>fps</span><input name="fps" type="number" step="1" min="1" value="60">
          </label>
          <label title="Number of grains (particles).">
            <span>grains</span><input name="grains" type="number" step="1" min="1" value="800">
          </label>
          <label title="dense: write every grain every frame. sparse: write only changed grains (smaller files).">
            <span>outputMode</span>
            <select name="outputMode">
              <option value="sparse" selected>sparse</option>
              <option value="dense">dense</option>
            </select>
          </label>
          <label title="Quantization factor for binary output; higher = finer (and bigger files). e.g., 16–64.">
            <span>quantization Q</span><input name="Q" type="number" step="1" min="8" value="32">
          </label>
          <label title="Sparse write threshold in pixels. Any grain that moves more than this (or on frame 0) is written.">
            <span>sparseThresholdPx</span><input name="sparseThresholdPx" type="number" step="0.01" min="0" value="0.03125">
          </label>
        </fieldset>

        <fieldset>
          <legend>Geometry</legend>
          <label title="Half-height of each bulb (px).">
            <span>H (px)</span><input name="H" type="number" step="1" min="100" value="500">
          </label>
          <label title="Half-width of bulb (px).">
            <span>bulb (px)</span><input name="bulb" type="number" step="1" min="50" value="220">
          </label>
          <label title="Neck opening width (px).">
            <span>neck (px)</span><input name="neck" type="number" step="1" min="6" value="18">
          </label>
          <label title="Grain radius (px).">
            <span>r (px)</span><input name="r" type="number" step="0.5" min="0.5" value="2">
          </label>
          <label title="Wall thickness (px). 0 = auto. Thickness grows outward only.">
            <span>wallThickness</span><input name="wallThickness" type="number" step="1" min="0" value="0">
          </label>
          <label title="Choose wall construction. 'capsule' uses overlapping circles for seam-free walls (higher CPU).">
            <span>wallMode</span>
            <select name="wallMode">
              <option value="rect">rectangles (fast)</option>
              <option value="capsule" selected>capsule (seam-free)</option>
            </select>
          </label>
          <label title="Curve coefficient: roundness shaping; small tweaks recommended.">
            <span>c1</span><input name="c1" type="number" step="0.05" value="0.0">
          </label>
          <label title="Curve coefficient: adds S-curve curvature; small tweaks recommended.">
            <span>c2</span><input name="c2" type="number" step="0.05" value="0.0">
          </label>
          <label title="Optional horizontal divider at the neck (px). 0 = none.">
            <span>slat (px)</span><input name="slat" type="number" step="1" min="0" value="0">
          </label>
          <label title="Tilt in degrees; only changes gravity direction, not visuals.">
            <span>tilt (deg)</span><input name="tiltDeg" type="number" step="0.1" value="0">
          </label>
        </fieldset>

        <fieldset>
          <legend>Material</legend>
          <label title="Restitution (bounciness) 0..1.">
            <span>bounce</span><input name="bounce" type="number" step="0.01" min="0" max="1" value="0.12">
          </label>
          <label title="Friction coefficient 0..1. Lower = more slip.">
            <span>friction</span><input name="friction" type="number" step="0.005" min="0" max="1" value="0.02">
          </label>
          <label title="Clamp grain speeds to this (px/s) for stability.">
            <span>maxSpeed</span><input name="maxSpeed" type="number" step="1" min="1" value="24">
          </label>
        </fieldset>

        <fieldset>
          <legend>Sleep & Flush</legend>
          <label title="Only grains below this speed (px/s) start accumulating sleep time.">
            <span>sleepVel</span><input name="sleepVel" type="number" step="0.1" min="0" value="2">
          </label>
          <label title="How long (ms) a slow grain must remain slow before freezing/sleeping/removal.">
            <span>sleepMs</span><input name="sleepMs" type="number" step="50" min="0" value="500">
          </label>
          <label title="What to do when a grain qualifies for sleep. 'static' keeps it as a blocker.">
            <span>sleepMode</span>
            <select name="sleepMode">
              <option value="static" selected>static</option>
              <option value="sleep">sleep</option>
              <option value="remove">remove</option>
            </select>
          </label>
          <label title="Only allow sleep deep in the bottom bulb (fraction of H). Combined with the bands below.">
            <span>sleepOnlyBelowFrac</span><input name="sleepOnlyBelowFrac" type="number" step="0.01" min="0" max="1" value="0.58">
          </label>
          <label title="No-sleep band around the neck (px). Within ±this, grains never sleep.">
            <span>neckNoSleepBandPx</span><input name="neckNoSleepBandPx" type="number" step="1" min="0" value="80">
          </label>
          <label title="Only allow sleep within this distance from the bottom (px).">
            <span>bottomSleepBandPx</span><input name="bottomSleepBandPx" type="number" step="1" min="0" value="175">
          </label>
          <label title="Stop at target frames even if top bulb hasn't emptied.">
            <span>noFlush</span><input name="noFlush" type="checkbox">
          </label>
          <label title="If flushing is allowed, after target frames keep going at most this many seconds.">
            <span>flushMaxSec</span><input name="flushMaxSec" type="number" step="1" min="1" value="15">
          </label>
        </fieldset>

        <details>
          <summary>Anti-Clog & Nudges</summary>
          <fieldset>
            <label title="Enable small gravity wobble and pulses to avoid arching at the neck.">
              <span>unclogAssist</span><input name="unclogAssist" type="checkbox" checked>
            </label>
            <label title="Base wobble amplitude (deg).">
              <span>vibeAmpDeg</span><input name="vibeAmpDeg" type="number" step="0.05" value="0.25">
            </label>
            <label title="Wobble frequency (Hz).">
              <span>vibeHz</span><input name="vibeHz" type="number" step="0.1" value="2.0">
            </label>
            <label title="Seconds of stalled flow before pulses kick in.">
              <span>antiClogPeriod</span><input name="antiClogPeriod" type="number" step="0.05" value="0.30">
            </label>
            <label title="If top grain count ≤ this, use stronger assists.">
              <span>rescueTopCount</span><input name="rescueTopCount" type="number" step="1" value="25">
            </label>
            <label title="Max wobble amplitude when fully engaged (deg).">
              <span>antiClogMaxAmpDeg</span><input name="antiClogMaxAmpDeg" type="number" step="0.1" value="4.5">
            </label>
            <label title="Pulse period (s). Smaller = more frequent.">
              <span>antiClogPulseEvery</span><input name="antiClogPulseEvery" type="number" step="0.01" value="0.12">
            </label>
            <label title="Vertical zone around neck to pulse (px).">
              <span>antiClogZoneY</span><input name="antiClogZoneY" type="number" step="1" value="30">
            </label>
            <label title="Also pulse below the neck (unchecked = only above).">
              <span>pulseBottomToo</span><input name="pulseBottomToo" type="checkbox">
            </label>
            <label title="Pulse force magnitude.">
              <span>antiClogPulseForce</span><input name="antiClogPulseForce" type="number" step="0.000001" value="0.00001">
            </label>
            <label title="Downward bias added to pulses above the neck.">
              <span>antiClogDownBias</span><input name="antiClogDownBias" type="number" step="0.000001" value="0.000004">
            </label>
          </fieldset>

          <fieldset>
            <legend>Wall Slip & Bias</legend>
            <label title="How close to the wall (px) to trigger a slip nudge.">
              <span>wallSlipPx</span><input name="wallSlipPx" type="number" step="0.1" value="1.2">
            </label>
            <label title="If speed below this (px/s), allow a slip nudge.">
              <span>wallSlipVel</span><input name="wallSlipVel" type="number" step="0.05" value="0.25">
            </label>
            <label title="Horizontal inward force for slip nudge.">
              <span>wallSlipKickF</span><input name="wallSlipKickF" type="number" step="0.000001" value="0.00012">
            </label>
            <label title="Downward force for slip nudge.">
              <span>wallSlipKickDownF</span><input name="wallSlipKickDownF" type="number" step="0.000001" value="0.00004">
            </label>
            <label title="Cooldown between slip nudges (ms).">
              <span>wallSlipCooldownMs</span><input name="wallSlipCooldownMs" type="number" step="10" value="250">
            </label>
            <label title="Band distance from wall where soft inward/down bias is applied.">
              <span>wallBiasBandPx</span><input name="wallBiasBandPx" type="number" step="1" value="14">
            </label>
            <label title="Inward bias magnitude.">
              <span>wallBiasInF</span><input name="wallBiasInF" type="number" step="0.000001" value="0.00016">
            </label>
            <label title="Downward bias magnitude.">
              <span>wallBiasDownF</span><input name="wallBiasDownF" type="number" step="0.000001" value="0.00006">
            </label>
          </fieldset>

          <fieldset>
            <legend>Outside Culling</legend>
            <label title="Immediate kill once center exceeds inner wall by this many px (strict small tolerance).">
              <span>strictKillPad</span><input name="strictKillPad" type="number" step="0.01" value="0.15">
            </label>
            <label title="Hard kill if beyond radius + pad (px).">
              <span>hardKillPad</span><input name="hardKillPad" type="number" step="0.01" value="0.2">
            </label>
            <label title="Debounced kill if beyond radius + pad (px).">
              <span>outsideKillPad</span><input name="outsideKillPad" type="number" step="0.01" value="0.5">
            </label>
            <label title="Frames outside before debounced kill triggers.">
              <span>outsideCullFrames</span><input name="outsideCullFrames" type="number" step="1" value="2">
            </label>
          </fieldset>
        </details>
      </form>
    </section>

    <section>
      <div id="progressWrap">
        <div class="muted">Status: <span id="status2">waiting</span></div>
        <progress id="prog" max="1" value="0"></progress>
        <div class="muted"><span id="pct">0%</span> — <span id="fframe">0</span>/<span id="ftarget">0</span></div>
        <div id="links" class="row" style="margin-top:8px; gap:12px;"></div>
      </div>
      <h3 style="margin:12px 0 6px">Live log</h3>
      <div id="log"></div>
    </section>
  </main>

  <script>
    const $ = sel => document.querySelector(sel);
    const form = $('#form');
    const startBtn = $('#startBtn');
    const statusEl = $('#status');
    const status2 = $('#status2');
    const logEl = $('#log');
    const prog = $('#prog');
    const pct = $('#pct');
    const fframe = $('#fframe');
    const ftarget = $('#ftarget');
    const links = $('#links');

    // persist settings
    const KEY = 'hourglass.bake.settings.v5';
    function saveSettings() {
      const data = Object.fromEntries(new FormData(form).entries());
      for (const el of form.querySelectorAll('input[type=checkbox]')) data[el.name] = el.checked;
      localStorage.setItem(KEY, JSON.stringify(data));
    }
    function loadSettings() {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      try {
        const d = JSON.parse(raw);
        for (const k in d) {
          if (form[k] == null) continue;
          if (form[k].type === 'checkbox') form[k].checked = !!d[k];
          else form[k].value = d[k];
        }
      } catch {}
    }
    form.addEventListener('input', saveSettings);
    loadSettings();

    function appendLog(kind, obj) {
      const t = new Date().toLocaleTimeString();
      if (kind === 'log') {
        logEl.textContent += `[${t}] ${obj.level ? '['+obj.level+'] ' : ''}${obj.msg}\n`;
      } else {
        logEl.textContent += `[${t}] [${kind}] ${JSON.stringify(obj)}\n`;
      }
      if (logEl.textContent.length > 80000) logEl.textContent = logEl.textContent.slice(-60000);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function startBake() {
      statusEl.textContent = 'starting…';
      status2.textContent = 'starting…';
      links.innerHTML = '';
      prog.value = 0; pct.textContent = '0%'; fframe.textContent = '0'; ftarget.textContent = '0';
      logEl.textContent = '';

      const data = Object.fromEntries(new FormData(form).entries());
      for (const el of form.querySelectorAll('input[type=checkbox]')) data[el.name] = el.checked;

      const NUMS = [
        'duration','fps','grains','H','bulb','neck','r','k','wallThickness','tiltDeg','c1','c2','slat',
        'bounce','friction','sleepVel','sleepMs','flushMaxSec','Q','sparseThresholdPx','maxSpeed',
        'sleepOnlyBelowFrac','neckNoSleepBandPx','bottomSleepBandPx',
        'outsideKillPad','outsideCullFrames','hardKillPad','strictKillPad',
        'vibeAmpDeg','vibeHz','antiClogPeriod','rescueTopCount','antiClogMaxAmpDeg','antiClogPulseEvery','antiClogZoneY','antiClogPulseForce','antiClogDownBias',
        'wallSlipPx','wallSlipVel','wallSlipKickF','wallSlipKickDownF','wallSlipCooldownMs','wallBiasBandPx','wallBiasInF','wallBiasDownF'
      ];
      for (const k of NUMS) if (data[k] != null && data[k] !== '') data[k] = Number(data[k]);

      const res = await fetch('/api/bake', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
      if (!res.ok) {
        statusEl.textContent = 'error'; status2.textContent = 'error';
        appendLog('log', {level:'err', msg:`HTTP ${res.status}`});
        return;
      }
      const { id } = await res.json();
      statusEl.textContent = `connected #${id}`;
      status2.textContent = `connected`;

      const es = new EventSource(`/api/stream/${id}`);
      es.addEventListener('hello', ev => appendLog('meta', JSON.parse(ev.data)));
      es.addEventListener('meta', ev => appendLog('meta', JSON.parse(ev.data)));
      es.addEventListener('log', ev => appendLog('log', JSON.parse(ev.data)));
      es.addEventListener('progress', ev => {
        const o = JSON.parse(ev.data);
        const p = o.target > 0 ? o.frame / o.target : 0;
        prog.max = 1; prog.value = p;
        pct.textContent = Math.round(p*100) + '%';
        fframe.textContent = o.frame; ftarget.textContent = o.target;
      });
      es.addEventListener('done', ev => {
        const o = JSON.parse(ev.data);
        appendLog('done', o);
        statusEl.textContent = 'done'; status2.textContent = 'done';
        const absJson = (o.file.startsWith('/') ? o.file : '/' + o.file);
        links.innerHTML = `
          <a href="${absJson}" target="_blank">Open JSON</a>
          <a href="/public/player.html?bake=${encodeURIComponent(absJson)}" target="_blank">Open in Player</a>
        `;
        es.close();
      });
      es.addEventListener('exit', ev => appendLog('exit', JSON.parse(ev.data)));
      es.onerror = () => appendLog('log', {level:'err', msg:`SSE error, readyState=${es.readyState}`});
    }

    startBtn.addEventListener('click', startBake);
  </script>
</body>
</html>
