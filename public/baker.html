<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Hourglass Baker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:980px;margin:20px auto;padding:0 16px;}
    header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    fieldset{border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0;}
    legend{padding:0 6px;color:#444;}
    label{display:grid;grid-template-columns:220px 1fr;gap:8px;align-items:center;margin:6px 0;}
    input[type="number"], input[type="text"], select{width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:6px;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    button{padding:10px 14px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer;}
    button.secondary{background:#555;}
    .bar{height:10px;background:#eee;border-radius:6px;overflow:hidden;margin:8px 0;}
    .bar>div{height:100%;width:0;background:#0a7;transition:width .2s;}
    pre{background:#0b0b0b;color:#e6e6e6;padding:10px;border-radius:8px;max-height:260px;overflow:auto;}
    .status{font-weight:600}
    .links a{margin-right:12px;}
  </style>
</head>
<body>
  <header>
    <h1>Hourglass Baker</h1>
    <div style="margin-left:auto"><a href="index.html">Bakes Index</a></div>
  </header>

  <form id="frm">
    <fieldset>
      <legend>Simulation</legend>
      <div class="row">
        <div>
          <label>duration (s) <input name="duration" type="number" min="1" step="1" value="10"></label>
          <label>fps <input name="fps" type="number" min="1" step="1" value="60"></label>
          <label>grains <input name="grains" type="number" min="1" step="1" value="500"></label>
          <label>full (0–1) <input name="full" type="number" min="0" max="1" step="0.05" value="1"></label>
          <label>neck (px) <input name="neck" type="number" min="4" step="1" value="12"></label>
          <label>H (px) <input name="H" type="number" min="100" step="10" value="500"></label>
          <label>bulb (px) <input name="bulb" type="number" min="50" step="10" value="220"></label>
          <label>r (grain radius) <input name="r" type="number" min="1" step="0.5" value="2"></label>
        </div>
        <div>
          <label>k (stiffness-ish) <input name="k" type="number" step="0.05" value="0.1"></label>
          <label>tilt (deg) <input name="tiltDeg" type="number" step="0.5" value="0"></label>
          <label>c1 (curve) <input name="c1" type="number" step="0.1" value="0.0"></label>
          <label>c2 (curve) <input name="c2" type="number" step="0.1" value="0.0"></label>
          <label>slat (px) <input name="slat" type="number" step="1" value="0"></label>
          <label>flushMaxSec <input name="flushMaxSec" type="number" step="1" value="15"></label>
          <label><input name="noFlush" type="checkbox"> noFlush</label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Sleep / Freeze</legend>
      <div class="row">
        <div>
          <label>sleepVel (px/s) <input name="sleepVel" type="number" step="0.1" value="2"></label>
          <label>sleepMs (ms) <input name="sleepMs" type="number" step="10" value="500"></label>
        </div>
        <div>
          <label>outputMode
            <select name="outputMode">
              <option value="dense">dense</option>
              <option value="sparse" selected>sparse</option>
            </select>
          </label>
          <label>quantization Q <input name="Q" type="number" step="1" value="32"></label>
        </div>
      </div>
    </fieldset>

    <div style="display:flex; gap:10px; align-items:center;">
      <button type="submit">Start bake</button>
      <button type="button" class="secondary" id="btnList">List bakes</button>
    </div>
  </form>

  <section id="live" style="display:none;">
    <p class="status">Status: <span id="statusText">Starting…</span></p>
    <div class="bar"><div id="bar"></div></div>
    <p><span id="pct">0%</span> — <span id="frames">0</span>/<span id="target">0</span></p>
    <pre id="log"></pre>
    <div class="links" id="doneLinks"></div>
  </section>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

function formToJSON(form) {
  const data = new FormData(form);
  const o = {};
  for (const [k, v] of data.entries()) {
    if (o[k] !== undefined) continue;
    const el = form.elements[k];
    if (el?.type === "checkbox") o[k] = el.checked;
    else if (el?.type === "number") o[k] = Number(v);
    else o[k] = v;
  }
  return o;
}

$("#frm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#live").style.display = "block";
  $("#doneLinks").innerHTML = "";
  $("#statusText").textContent = "Submitting…";

  const body = formToJSON(e.currentTarget);
  try {
    const res = await fetch("/api/bake", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const txt = await res.text();
      $("#statusText").textContent = `Error: HTTP ${res.status}`;
      $("#log").textContent += `HTTP ${res.status}: ${txt}\n`;
      return;
    }
    const { id } = await res.json();
    $("#statusText").textContent = `Queued (id ${id})`;
    subscribe(id);
  } catch (err) {
    $("#statusText").textContent = "Request failed";
    $("#log").textContent += String(err) + "\n";
  }
});

$("#btnList").addEventListener("click", () => location.href = "index.html");

function subscribe(id) {
  const es = new EventSource(`/api/stream/${id}`);
  const log = (m) => { const el = $("#log"); el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };
  let target = 0;
  es.addEventListener("hello", ev => log("connected"));
  es.addEventListener("ping", ev => {});
  es.addEventListener("meta", ev => {
    const d = JSON.parse(ev.data);
    log("meta: " + JSON.stringify(d));
  });
  es.addEventListener("progress", ev => {
    const d = JSON.parse(ev.data);
    target = d.target || target;
    $("#frames").textContent = d.frame;
    $("#target").textContent = target;
    const pct = target ? Math.round(100 * d.frame / target) : 0;
    $("#pct").textContent = pct + "%";
    $("#bar").style.width = pct + "%";
    $("#statusText").textContent = "Baking…";
  });
  es.addEventListener("log", ev => {
    const d = JSON.parse(ev.data);
    log(`[${d.level}] ${d.msg}`);
  });
  es.addEventListener("done", ev => {
    const d = JSON.parse(ev.data);
    $("#statusText").textContent = "Done";
    const absJson = new URL(d.file, location.origin).toString();
    const playerUrl = `player.html?bake=${encodeURIComponent(absJson)}`;
    $("#doneLinks").innerHTML = `<a href="${absJson}" target="_blank">Open JSON</a> <a href="${playerUrl}" target="_blank">Open in Player</a>`;
  });
  es.addEventListener("exit", ev => {
    const d = JSON.parse(ev.data);
    log(`exit code=${d.code} signal=${d.signal}`);
  });
  es.onerror = (e) => {
    $("#statusText").textContent = "SSE error";
    log("[es] error, readyState=" + es.readyState);
  };
}
</script>
</body>
</html>
