<!doctype html>
<meta charset="utf-8">
<title>Hourglass — Sparse Player (Pro)</title>
<style>
  :root{--bg:#0b0c10;--text:#e8ecf1;--muted:#9aa3ad;--card:#11131a;--line:#20232b}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px system-ui}
  header{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
  .left, .right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{color:var(--muted)}
  input[type="text"],input[type="number"]{background:#11131a;border:1px solid #1f2430;color:var(--text);border-radius:8px;padding:6px 8px}
  input[type="range"]{width:320px}
  button{background:#141823;border:1px solid #2a2f3a;color:var(--text);border-radius:10px;padding:6px 10px;cursor:pointer}
  label{color:var(--muted);display:flex;gap:6px;align-items:center}
  .wrap{display:grid;place-items:center;height:calc(100vh - 106px)}
  canvas{background:radial-gradient(1200px 700px at 50% 15%,rgba(255,255,255,.04),transparent 60%),#0b0c10;border:1px solid #1b1f28;border-radius:16px;width:min(900px,98vw);height:calc(min(900px,98vw)*1.1)}
  .row{display:flex;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
  .time{font-variant-numeric:tabular-nums}

  /* ------------ Tooltips ------------- */
  [data-tip] { position: relative; }
  [data-tip]::after, [data-tip]::before { pointer-events:none; position:absolute; opacity:0; transition:opacity .12s ease, transform .12s ease; z-index:50 }
  [data-tip]:hover::after, [data-tip]:focus-visible::after,
  [data-tip]:hover::before, [data-tip]:focus-visible::before { opacity:1 }
  [data-tip]::after{
    content: attr(data-tip);
    left: 50%; top: calc(100% + 10px);
    transform: translateX(-50%) translateY(-4px);
    background:#0f1219; color:#e8ecf1; border:1px solid #263247;
    border-radius:8px; padding:8px 10px; max-width:340px; width:max-content; box-shadow:0 6px 18px rgba(0,0,0,.35);
    white-space:normal; line-height:1.25;
  }
  [data-tip]::before{
    content:"";
    left:50%; top:100%;
    transform: translateX(-50%) translateY(-4px);
    border:6px solid transparent; border-bottom-color:#263247;
  }
</style>

<header>
  <div class="left">
    <strong>Baked Hourglass</strong>
    <label data-tip="Path/URL to a baked metadata JSON. • Sparse format: JSON contains a 'bin' field pointing to a .bin file (no 'data'). • Dense/legacy: JSON has a base64 'data' field (smaller tests only).">
      Meta URL
      <input id="url" type="text" placeholder="bakes/…sparse.json" size="36" aria-label="Meta URL">
    </label>
    <button id="open" data-tip="Load the meta JSON. If it's sparse, the matching .bin file is fetched next to it.">Open</button>
    <span id="info" class="pill" data-tip="Summary of the loaded bake: format, frame count, grain count, and baked fps.">—</span>
  </div>
  <div class="right">
    <button id="pp" data-tip="Play/Pause. Spacebar also toggles.">Play</button>
    <button id="restart" data-tip="Jump to the first frame and keep current play/pause state (keyboard: R to restart and play).">Restart</button>
    <button id="stepBack" data-tip="Step back one frame (keyboard: ←).">−1f</button>
    <button id="stepFwd"  data-tip="Step forward one frame (keyboard: →).">+1f</button>
    <button id="secBack"  data-tip="Jump back one second of playback time (uses current target duration mapping). Shift+← also does this.">−1s</button>
    <button id="secFwd"   data-tip="Jump forward one second of playback time. Shift+→ also does this.">+1s</button>
    <label data-tip="When enabled, playback restarts automatically after the last frame (keyboard: toggle via the checkbox).">
      <input id="loopToggle" type="checkbox" aria-label="Loop"> Loop
    </label>
    <label data-tip="Real-time speed multiplier (0.25×–2×). Changes how fast frames advance in the browser; it does NOT change the baked timing or target duration mapping.">
      Speed
      <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1" aria-label="Playback Speed">
    </label>
  </div>
</header>

<div class="row">
  <span class="time" id="cur" data-tip="Current playback time (wall-clock), computed from the current 'Target duration' mapping.">00:00.0</span>
  <input id="scrub" type="range" min="0" max="0" step="1" value="0" style="flex:1"
         aria-label="Scrub timeline"
         data-tip="Scrub to any frame. Hold and drag. Releasing keeps the current frame; press Play to resume.">
  <span class="time" id="tot" data-tip="Total playback time according to the current 'Target duration' mapping (end frame time).">00:00.0</span>
  <label data-tip="Set the wall-clock time you want the LAST frame to line up with. Accepts mm:ss or seconds (e.g., 300). This only remaps playback; it does not modify the simulation.">
    Target duration
    <input id="target" type="text" value="00:00" aria-label="Target duration (mm:ss or seconds)">
  </label>
  <button id="applySync" data-tip="Apply the target duration mapping now. The last frame is guaranteed to occur exactly at that time; the player linearly remaps frames to wall-clock time.">Sync end</button>
  <span class="pill" id="fps" data-tip="Approximate render FPS of the viewer (UI + canvas). This is NOT the baked fps and can fluctuate based on your machine.">fps: —</span>
</div>

<div class="wrap">
  <canvas id="cv" data-tip="Canvas preview of the baked hourglass. The outline matches the baked silhouette; grains are drawn as circles from the baked positions."></canvas>
</div>

<script>
/* ====== State ====== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

let meta=null, bin=null, dv=null;
let xq=null, yq=null;         // current quantized positions
let offsets=null;             // frame -> byte offset (sparse)
let frameFloat=0, frameInt=0, framesTotal=0;
let playing=false, lastT=performance.now(), speed=1, isLooping=false;

// Playback fps mapping (can be overridden by "Target duration")
let playFps = 30; // effective fps used to convert time<->frame

// UI helpers
const $ = id => document.getElementById(id);
const ui = {
  open: $('open'), url: $('url'), info: $('info'),
  pp: $('pp'), restart: $('restart'),
  stepBack: $('stepBack'), stepFwd: $('stepFwd'),
  secBack: $('secBack'), secFwd: $('secFwd'),
  loopToggle: $('loopToggle'), speed: $('speed'),
  scrub: $('scrub'), cur: $('cur'), tot: $('tot'),
  target: $('target'), applySync: $('applySync'),
  fps: $('fps'),
};

/* ====== Layout ====== */
function fit(){
  const DPR=Math.max(1,Math.min(2,devicePixelRatio||1));
  const cssW=Math.min(900, innerWidth*0.98), cssH=cssW*1.1;
  cv.style.width=cssW+'px'; cv.style.height=cssH+'px';
  cv.width=Math.round(cssW*DPR); cv.height=Math.round(cssH*DPR);
  return {DPR, cssW, cssH};
}
let view=fit(); addEventListener('resize', ()=>view=fit());

/* ====== Time utils ====== */
function mmss(seconds){
  if (!isFinite(seconds)) return "00:00.0";
  const s = Math.max(0, seconds);
  const m = Math.floor(s/60);
  const sec = (s%60).toFixed(1).padStart(4,'0');
  return `${String(m).padStart(2,'0')}:${sec}`;
}
function parseTime(str){
  if (!str) return NaN;
  if (/^\d+(\.\d+)?$/.test(str.trim())) return +str;
  const parts = str.trim().split(':');
  if (parts.length===2){
    const m=+parts[0], s=+parts[1];
    if (isFinite(m) && isFinite(s)) return m*60 + s;
  }
  return NaN;
}

/* ====== Silhouette drawing ====== */
function widthAtY(y, m){
  const {H, bulb, neck, k=1.05}=m;
  const t=Math.min(1, Math.abs(y)/H);
  return neck + (bulb-neck) * Math.pow(t,k);
}
function drawGlass(ctx,m,DPR){
  const {H}=m, steps=72;
  ctx.save();
  ctx.lineWidth=Math.max(1.5, 2*DPR/2);
  ctx.strokeStyle="rgba(255,255,255,0.16)";
  ctx.beginPath();
  for(let i=0;i<=steps;i++){ const t=-H+i*(2*H/steps), x=-widthAtY(t,m); i?ctx.lineTo(x,t):ctx.moveTo(x,t); }
  ctx.stroke();
  ctx.beginPath();
  for(let i=0;i<=steps;i++){ const t=-H+i*(2*H/steps), x=+widthAtY(t,m); i?ctx.lineTo(x,t):ctx.moveTo(x,t); }
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-widthAtY(-H,m),-H); ctx.lineTo(widthAtY(-H,m),-H);
  ctx.moveTo(-widthAtY( H,m), H); ctx.lineTo(widthAtY( H,m), H);
  ctx.stroke();
  ctx.strokeStyle="rgba(79,195,247,0.28)";
  ctx.beginPath(); ctx.moveTo(-m.neck,0); ctx.lineTo(m.neck,0); ctx.stroke();
  ctx.restore();
}

/* ====== Playback helpers ====== */
function setPlaying(p){
  playing=p; ui.pp.textContent = p ? 'Pause' : 'Play';
  lastT=performance.now();
}

function resetToStart(){
  if (!meta || !xq || !yq) return;
  if (meta.format === 'sparse' && dv){
    const g=meta.grains;
    for(let i=0;i<g;i++){
      xq[i] = dv.getUint16(i*4+0, true);
      yq[i] = dv.getUint16(i*4+2, true);
    }
  } else if (meta.format === 'dense' && bin?.dense){
    copyDenseFrame(0);
  }
  frameFloat = 0; frameInt = 0;
}

function buildOffsetsSparse(){
  const g = meta.grains;
  offsets = new Uint32Array(meta.frames);
  offsets[0] = g*4; // after initial full frame
  let off = offsets[0];
  for(let f=1; f<meta.frames; f++){
    const count = dv.getUint16(off, true);
    off += 2 + count * 6; // count(u16) + count*(id,x,y)
    offsets[f] = off;
  }
}

/* ====== Loading (robust sparse/dense detection) ====== */
async function loadMeta(url){
  const res = await fetch(url);
  const m = await res.json();

  // Treat as sparse if meta says so OR it has a .bin path and no base64 "data"
  const isSparse = (m.format === 'sparse') || (!!m.bin && !m.data);

  if (isSparse){
    meta = m;
    const binURL = new URL(meta.bin, new URL(url, location.href)).href;
    const res2 = await fetch(binURL);
    if (!res2.ok) throw new Error(`Failed to fetch data bin: ${res2.status} ${res2.statusText}\nURL: ${binURL}`);
    bin = await res2.arrayBuffer();
    dv = new DataView(bin);

    xq = new Uint16Array(meta.grains);
    yq = new Uint16Array(meta.grains);
    resetToStart();
    buildOffsetsSparse();

    framesTotal = meta.frames;
    playFps = meta.fps;
    ui.target.value = mmss(framesTotal / playFps);
    ui.scrub.max = String(framesTotal-1);
    ui.tot.textContent = mmss(framesTotal / playFps);
    ui.info.textContent = `sparse • ${meta.frames} frames • ${meta.grains} grains • ${meta.fps.toFixed(2)} fps`;
  } else {
    // legacy dense base64 JSON { meta, data }
    const denseMeta = m.meta ?? m;
    const buf = Uint8Array.from(atob(m.data), c=>c.charCodeAt(0)).buffer;
    const dense = new Uint16Array(buf);
    meta = {
      format: 'dense',
      frames: denseMeta.frames,
      grains: denseMeta.grains,
      fps: denseMeta.fps,
      Q: denseMeta.Q,
      H: denseMeta.H, bulb: denseMeta.bulb, neck: denseMeta.neck,
      r: denseMeta.r, k: denseMeta.k ?? 1.05
    };
    bin = {dense};
    dv = null;
    xq = new Uint16Array(meta.grains);
    yq = new Uint16Array(meta.grains);
    framesTotal = meta.frames;
    playFps = meta.fps;
    ui.target.value = mmss(framesTotal / playFps);
    ui.scrub.max = String(framesTotal-1);
    ui.tot.textContent = mmss(framesTotal / playFps);
    ui.info.textContent = `dense • ${meta.frames} frames • ${meta.grains} grains • ${meta.fps.toFixed(2)} fps`;

    copyDenseFrame(0);
  }
  setPlaying(true);
}

function copyDenseFrame(fi){
  const g=meta.grains, base=fi*g*2, arr=bin.dense;
  for(let i=0;i<g;i++){ xq[i]=arr[base+i*2]; yq[i]=arr[base+i*2+1]; }
}

function advanceForwardTo(target){
  if (meta.format === 'sparse'){
    while (frameInt < target){
      frameInt++;
      const off = offsets[frameInt-1];
      let p = off;
      const count = dv.getUint16(p, true); p += 2;
      for(let k=0;k<count;k++){
        const id = dv.getUint16(p, true);  p+=2;
        const X  = dv.getUint16(p, true);  p+=2;
        const Y  = dv.getUint16(p, true);  p+=2;
        xq[id]=X; yq[id]=Y;
      }
    }
  } else {
    copyDenseFrame(target);
    frameInt = target;
  }
}

function seekTo(target){
  target = Math.max(0, Math.min(framesTotal-1, target|0));
  if (target === frameInt) return;
  if (meta.format === 'sparse'){
    if (target < frameInt){
      resetToStart();
    }
    advanceForwardTo(target);
  } else {
    copyDenseFrame(target);
    frameInt = target;
  }
  frameFloat = target;
  ui.scrub.value = String(target);
}

/* ====== Render ====== */
function draw(){
  if(!meta || !xq || !yq) return;   // guard until buffers are ready
  const {DPR, cssW, cssH} = view;
  const {H, bulb, r, Q=32} = meta;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  ctx.save(); ctx.translate(cssW/2, cssH/2);

  drawGlass(ctx, meta, DPR);

  ctx.fillStyle="rgba(244,143,177,0.96)";
  ctx.beginPath();
  for(let i=0;i<meta.grains;i++){
    const x = xq[i]/Q - bulb - 5;
    const y = yq[i]/Q - H    - 5;
    ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,Math.PI*2);
  }
  ctx.fill();

  ctx.restore();
}

/* ====== Main tick ====== */
let fpsEMA = 60;
function tick(){
  requestAnimationFrame(tick);
  if(!meta || !xq || !yq) return;   // guard until ready
  const now = performance.now();
  const dt  = (now - lastT)/1000; lastT = now;

  if (playing){
    frameFloat += speed * dt * playFps;
    let target = Math.floor(frameFloat);
    if (target >= framesTotal){
      if (isLooping){
        resetToStart();
        frameFloat = 0;
        target = 0;
      } else {
        target = framesTotal-1;
        frameFloat = target;
        setPlaying(false);
      }
    }
    if (target !== frameInt){
      if (target < frameInt) seekTo(target); else advanceForwardTo(target);
      ui.scrub.value = String(frameInt);
    }
  }

  const curSec = frameFloat / playFps;
  const totSec = (framesTotal-1) / playFps;
  ui.cur.textContent = mmss(curSec);
  ui.tot.textContent = mmss(totSec);

  fpsEMA = fpsEMA*0.9 + (1/dt)*0.1;
  ui.fps.textContent = 'fps: ' + fpsEMA.toFixed(0);

  draw();
}

/* ====== UI wiring ====== */
ui.open.onclick = () => { const u=ui.url.value.trim(); if(u) loadMeta(u).catch(e=>alert(e.message)); };
ui.pp.onclick = () => setPlaying(!playing);
ui.restart.onclick = () => { resetToStart(); setPlaying(true); };
ui.stepBack.onclick = () => { setPlaying(false); seekTo(frameInt-1); };
ui.stepFwd.onclick  = () => { setPlaying(false); seekTo(frameInt+1); };
ui.secBack.onclick  = () => { setPlaying(false); seekTo(frameInt - Math.round(playFps)); };
ui.secFwd.onclick   = () => { setPlaying(false); seekTo(frameInt + Math.round(playFps)); };
ui.loopToggle.onchange = (e) => isLooping = e.target.checked;
ui.speed.oninput    = (e) => speed = +e.target.value;

ui.scrub.addEventListener('pointerdown', ()=>{ setPlaying(false); });
ui.scrub.addEventListener('input', e=>{ seekTo(+e.target.value); });

ui.applySync.onclick = () => {
  if (!meta) return;
  const sec = parseTime(ui.target.value);
  if (!isFinite(sec) || sec <= 0) { alert('Enter mm:ss or seconds'); return; }
  playFps = framesTotal / sec;            // remap so last frame hits exactly at target time
  ui.tot.textContent = mmss((framesTotal-1) / playFps);
  const rel = framesTotal ? frameFloat/framesTotal : 0;
  frameFloat = rel * framesTotal;
};

addEventListener('keydown', e=>{
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'r') { e.preventDefault(); ui.restart.click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); (e.shiftKey?ui.secBack:ui.stepBack).click(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); (e.shiftKey?ui.secFwd:ui.stepFwd).click(); }
  else if (e.key === 'Home'){ e.preventDefault(); setPlaying(false); seekTo(0); }
  else if (e.key === 'End'){ e.preventDefault(); setPlaying(false); seekTo(framesTotal-1); }
});

// autoload via ?meta=URL
const q = new URLSearchParams(location.search).get('meta');
if(q) ui.url.value = q, loadMeta(q).catch(e=>alert(e.message));

// start
requestAnimationFrame(tick);
</script>
